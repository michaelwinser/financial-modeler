# nginx config for serving the financial-modeler SPA inside the runtime
# container. Replaces /etc/nginx/conf.d/default.conf.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback. The app currently has no client-side routing, so this
    # is future-proofing — when it gains routes (compare view, scenarios),
    # browser refresh on a deep URL will still serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed filenames under /assets/, so we can cache them
    # aggressively. The hash changes on rebuild, busting the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the entry point — never cache it, since its inline
    # references (script src, css href) update on every build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Compression. Skips already-compressed types.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers. Conservative defaults; tighten if the deployment
    # ever introduces auth or third-party embeds.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version from server header.
    server_tokens off;
}
