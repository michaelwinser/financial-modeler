name: Publish

# Build the production image and push to GitHub Container Registry.
# Triggered on every push to `main` (publishes :latest, :main, :sha-<short>)
# and on version tags v* (publishes :v1.2.3, :1.2.3, :1.2, :1).
# Manual via workflow_dispatch for ad-hoc rebuilds.
#
# Auth: uses the auto-injected GITHUB_TOKEN. No external secrets required.
# The token has permission to push to ghcr.io for the same repo when the
# job declares `permissions: packages: write` below.
#
# First-time visibility: GHCR packages are private by default. After the
# first successful push, set the package to public via
# https://github.com/<owner>/financial-modeler/pkgs/container/financial-modeler
# (Package settings → Change visibility → Public) if you want
# unauthenticated `docker pull`.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build & push to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository_owner so forks publish under their own org/user.
          images: ghcr.io/${{ github.repository_owner }}/financial-modeler
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mocks/main-view
          file: mocks/main-view/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
