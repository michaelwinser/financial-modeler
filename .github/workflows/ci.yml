name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid burning CI on stale runs when a push lands while one is in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: typecheck • test • build
    runs-on: ubuntu-latest
    defaults:
      run:
        # All app commands run from the app's package directory.
        working-directory: mocks/main-view

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth: the .nvmrc at repo root.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mocks/main-view/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
